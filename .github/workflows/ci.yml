name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SPEC §14: a milestone is done when the gate is green — the same three
      # commands every milestone is held to locally.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build
